function render(h,mode=state.mode){document.body.className=mode?'mode-'+mode:'';app.innerHTML=h;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions[b.dataset.act]())}
function home(){clearTimer();state={...state,screen:'home',mode:null,score:0,wrong:0,streak:0,cheated:false,finishSent:false};render(`<div class="card"><h1 class="title">Lovci pravopisu adjektiv místních</h1><p class="subtitle">Zapiš přesný adjektivní tvar v jednotném a množném čísle.</p><div class="row"><button class="btn challengeBtn" data-act="nameChallenge">VÝZVA</button><button class="btn testBtn" data-act="nameTest">TEST</button></div><div class="row"><a class="btn ghost" href="${RESULTS_SHEET_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">VÝSLEDKOVÁ TABULKA</a></div><p class="small">VÝZVA: 30 správných odpovědí v řadě = jednička. TEST: 15 úloh, každá za 2 body. Čas: 30 s na úlohu.<br>Databáze v této verzi: ${LOCAL_ADJECTIVES.length} úloh.</p></div>`,null)}
function nameScreen(mode){state.mode=mode;render(`<div class="card"><h1 class="title">${mode==='challenge'?'VÝZVA':'TEST'}</h1><div class="nameBox"><input class="input" id="name" placeholder="Jméno žáka"><input class="input" id="clazz" placeholder="Třída"><button class="btn ${mode==='challenge'?'challengeBtn':'testBtn'}" id="start">ZAČÍT</button><button class="btn ghost" data-act="home">HLAVNÍ MENU</button></div></div>`,mode);document.getElementById('start').onclick=()=>{state.name=document.getElementById('name').value.trim();state.clazz=document.getElementById('clazz').value.trim();if(!state.name||!state.clazz){alert('Vyplň jméno i třídu.');return}start(mode)}}
function start(mode){state={...state,screen:'question',mode,score:0,wrong:0,streak:0,index:0,locked:false,cheated:false,finishSent:false,pool:shuffle(LOCAL_ADJECTIVES)};if(mode==='test')state.pool=state.pool.slice(0,TEST_COUNT);next()}
function next(){clearTimer();state.locked=false;if(state.mode==='challenge'){if(!state.pool.length)state.pool=shuffle(LOCAL_ADJECTIVES);state.current=state.pool.pop()}else{if(state.index>=state.pool.length)return finishTest();state.current=state.pool[state.index]}renderQuestion();startTimer()}
function renderQuestion(){const m=state.mode,q=state.current;const status=m==='challenge'?`SÉRIE ${state.streak}/${CHALLENGE_TARGET}`:`ÚLOHA ${state.index+1}/${state.pool.length} • BODY ${state.score}/30`;render(`<div class="card"><div class="topbar"><div class="seal ${m==='challenge'?'challengeSeal':'testSeal'}">${m==='challenge'?'VÝZVA':'TEST'}</div><div class="timeCenter"><span id="time">${TIME_LIMIT}</span><span class="status">${status}</span></div><div class="seal sectionSeal">ADJEKTIVA<br>MÍSTNÍ</div></div><div class="prompt">Zapiš adjektivní tvar od názvu</div><div class="question">${esc(q.place)}</div><div class="answerGrid"><div class="answerBox"><label for="singular">Jednotné číslo</label><input class="answerInput" id="singular" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Adjektivum v jednotném čísle"></div><div class="answerBox"><label for="plural">Množné číslo</label><input class="answerInput" id="plural" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Adjektivum v množném čísle"></div></div><div class="row"><button class="btn submitArc" id="submit">POTVRDIT</button></div><div class="feedback" id="fb"></div><div class="small"><a href="#" data-act="home" style="color:var(--muted)">Hlavní menu</a></div></div>`,m);const one=document.getElementById('singular'),many=document.getElementById('plural');document.getElementById('submit').onclick=answer;one.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();many.focus()}});many.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();answer()}});one.focus()}
function answer(){if(state.locked)return;const one=document.getElementById('singular'),many=document.getElementById('plural');state.locked=true;clearTimer();const oneGood=normalizeAnswer(one.value)===normalizeAnswer(state.current.singular),manyGood=normalizeAnswer(many.value)===normalizeAnswer(state.current.plural),good=oneGood&&manyGood;one.disabled=many.disabled=true;const submit=document.getElementById('submit');submit.disabled=true;one.classList.add(oneGood?'correct':'wrong');many.classList.add(manyGood?'correct':'wrong');const fb=document.getElementById('fb');if(good){state.score+=2;state.streak+=2;fb.innerHTML='<span class="ok">SPRÁVNĚ! +2 BODY</span>';soundCorrect();if(state.mode==='challenge'&&state.streak>=CHALLENGE_TARGET)return setTimeout(finishChallenge,700)}else{state.wrong++;state.streak=0;fb.innerHTML=`<span class="bad">CHYBA – SÉRIE ZAČÍNÁ ZNOVU</span><br><span class="small">Správně: ${esc(state.current.singular)} • ${esc(state.current.plural)}<br>${mistakeDetails(one.value,many.value,oneGood,manyGood)}</span>`;soundWrong();submit.textContent='DALŠÍ';submit.disabled=false;submit.onclick=advanceNow}if(state.mode==='test')state.index++;scheduleAdvance(good?750:10000)}
function timeout(){if(state.locked)return;state.locked=true;state.wrong++;state.streak=0;const one=document.getElementById('singular'),many=document.getElementById('plural');one.disabled=many.disabled=true;one.classList.add(normalizeAnswer(one.value)===normalizeAnswer(state.current.singular)?'correct':'wrong');many.classList.add(normalizeAnswer(many.value)===normalizeAnswer(state.current.plural)?'correct':'wrong');const submit=document.getElementById('submit');submit.textContent='DALŠÍ';submit.disabled=false;submit.onclick=advanceNow;document.getElementById('fb').innerHTML=`<span class="bad">ČAS VYPRŠEL – SÉRIE ZAČÍNÁ ZNOVU</span><br><span class="small">Správně: ${esc(state.current.singular)} • ${esc(state.current.plural)}</span>`;soundWrong();if(state.mode==='test')state.index++;scheduleAdvance(10000)}
function scheduleAdvance(delay){if(state.advanceTimer)clearTimeout(state.advanceTimer);state.advanceTimer=setTimeout(()=>{state.advanceTimer=null;next()},delay)}
function advanceNow(){if(!state.advanceTimer)return;clearTimeout(state.advanceTimer);state.advanceTimer=null;next()}
function startTimer(){state.timeLeft=TIME_LIMIT;updateTime();state.timer=setInterval(()=>{state.timeLeft--;updateTime();if(state.timeLeft<=0){clearTimer();timeout()}},1000)}
function updateTime(){const e=document.getElementById('time');if(e)e.textContent=state.timeLeft}function clearTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}if(state.advanceTimer){clearTimeout(state.advanceTimer);state.advanceTimer=null}}
function grade(s){if(s>=29)return 1;if(s>=27)return 2;if(s>=25)return 3;if(s>=23)return 4;return 5}
function finishTest(){clearTimer();state.screen='finish';const z=state.cheated?6:grade(state.score);sendResult(z,30,'TEST');render(`<div class="card"><h1 class="title">VÝSLEDEK</h1><div class="result"><b>${esc(state.name)}</b> • ${esc(state.clazz)}<br><b>Body:</b> ${state.score}/30<br><b>Známka:</b> ${z}</div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`,'test')}
function finishChallenge(){clearTimer();state.screen='finish';sendResult(1,state.score+state.wrong*2,'VÝZVA');render(`<div class="card"><div class="result"><b>Dokázal jsi napsat 30 odpovědí za sebou správně, a tak máš jedničku!</b></div><div class="row"><button class="btn challengeBtn" data-act="home">HLAVNÍ MENU</button></div></div>`,'challenge')}
function buildPayload(z,total,kind){return{timestamp:new Date().toISOString(),jmeno:state.name,trida:state.clazz,znamka:z,rezim:kind.toLowerCase(),oddil:'adjektiva místní',body:state.score,celkem:total,spravne:state.score,spatne:state.wrong,poznamka:state.cheated?'PODVOD':kind,sheetId:SHEET_ID,app:'Lovci pravopisu adjektiv místních'}}
function sendResult(z,total,kind,urgent=false){if(state.finishSent&&!urgent)return;state.finishSent=true;const p=buildPayload(z,total,kind),params=new URLSearchParams();Object.entries(p).forEach(([k,v])=>params.append(k,String(v??'')));try{if(urgent&&navigator.sendBeacon){navigator.sendBeacon(GAS_WEB_APP_URL,new Blob([params.toString()],{type:'application/x-www-form-urlencoded'}))}else fetch(GAS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),keepalive:true})}catch(e){}}
function activeProtected(){return ['test','challenge'].includes(state.mode)&&state.screen==='question'}
function cheatFinish(reason){soundCheat();if(!activeProtected())return;state.cheated=true;state.locked=true;state.screen='finish';clearTimer();sendResult(6,state.mode==='test'?30:state.score+state.wrong*2,'PODVOD: '+reason,true);render(`<div class="card cheat"><h1 class="title">PODVOD</h1><div class="result">Pokus byl ukončen kvůli opuštění testovacího okna.<br><b>Známka: 6</b></div><div class="row"><button class="btn" data-act="home">HLAVNÍ MENU</button></div></div>`,state.mode)}
let audioCtx=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function tone(freq,dur,gain=.08,type='sine',delay=0){try{unlockAudio();if(!audioCtx)return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function soundCorrect(){tone(720,.08,.06);tone(980,.10,.05,'sine',.07)}function soundWrong(){tone(150,.20,.22,'square');tone(110,.23,.20,'sawtooth',.17)}function soundCheat(){tone(95,.65,.28,'sawtooth');tone(70,.65,.24,'square',.35)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)cheatFinish('přepnutí mimo stránku')});window.addEventListener('pagehide',()=>cheatFinish('opuštění stránky'));window.addEventListener('beforeunload',e=>{if(activeProtected()){e.preventDefault();e.returnValue=''}});window.addEventListener('blur',()=>setTimeout(()=>{if(activeProtected()&&document.visibilityState==='visible'&&!document.hasFocus())cheatFinish('ztráta aktivního okna')},650));
const actions={home,nameChallenge:()=>nameScreen('challenge'),nameTest:()=>nameScreen('test')};home();
</script></body></html>
